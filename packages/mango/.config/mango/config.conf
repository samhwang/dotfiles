# Validate: mango -c ~/.config/mango/config.conf -p
# Reload: mmsg dispatch reload_config (Noctalia must restart by hand, noctalia#4905)

# --- Monitors ---
# Matched on make/model so a DP name change survives.
monitor_rule=make:Xiaomi Corporation,model:Mi Monitor,width:3440,height:1440,refresh:144,x:0,y:0,scale:1,primary:1

# --- Environment ---
env=XCURSOR_SIZE,24
env=XMODIFIERS,@im=fcitx

# --- Autostart (exec_once survives config reloads) ---
exec_once=/usr/lib/pam_kwallet_init
exec_once=noctalia
exec_once=fcitx5 -d
exec_once=wl-clip-persist --clipboard regular
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=udiskie --tray
exec_once=1password

# --- Look and feel ---
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=20
gap_outer_vertical=20
border_px=2
border_radius=10
focused_opacity=1.0
unfocused_opacity=1.0

blur=1
# Noctalia's Mango guide keeps layer blur off; window blur stays on.
blur_layer=0
blur_optimized=1
blur_params_radius=3
blur_params_num_passes=1

shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_color=0x1a1a1aee

# --- Layouts ---
tag_rule=id:*,layout_name:dwindle
dwindle_preserve_split=1
circle_layout=dwindle,scroller
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0

# --- Rules ---
layer_rule=layer_name:^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$,no_animation:1
window_rule=is_floating:1,width:1080,height:920,app_id:dev.noctalia.Noctalia

# --- Input ---
xkb_rules_layout=us
trackpad_natural_scrolling=0
mouse_accel_speed=0
xwayland_ignore_scale=1
drag_tile_to_tile=1

# --- Bindings ---
bind=SUPER,Q,spawn,ghostty
bind=SUPER,C,killclient
bind=SUPER,M,quit
bind=SUPER,E,spawn,dolphin
bind=SUPER+SHIFT,V,togglefloating
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,F,togglefullscreen
bind=SUPER+CTRL+ALT+SHIFT,L,switch_layout

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,toggle_special_tag

bind=SUPER,Tab,viewtoright_have_client
bind=SUPER+SHIFT,Tab,viewtoleft_have_client
bind=SUPER+CTRL,Tab,view,-1

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag_special_tag

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous

bindl=SUPER+SHIFT,L,spawn,noctalia msg session lock
bindl=SUPER+SHIFT,P,spawn,noctalia msg session lock-and-suspend

bind=SUPER+SHIFT,W,spawn_shell,grim - | wl-copy
bind=SUPER+SHIFT,S,spawn_shell,grim -g "$(slurp -w 0)" - | wl-copy
bind=SUPER,V,spawn,noctalia msg panel-toggle clipboard
